# Generated by dbuild from compose.yaml: Database = PostgreSQL. Edit compose.yaml, not this.
name: mealie

services:
  mealie:
    depends_on: [postgres]
    image: ghcr.io/daemonless/mealie:latest
    container_name: mealie
    restart: unless-stopped

    environment:
      - BASE_URL=http://localhost:9000
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # The database, from the Database choice; sqlite needs nothing else.
      - DB_ENGINE=${DB_ENGINE:-sqlite}
      - POSTGRES_SERVER=${POSTGRES_SERVER:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-}

    volumes:
      - /path/to/containers/mealie:/config

    ports:
      - "9000:9000"
  postgres:
    image: ghcr.io/daemonless/postgres:17
    restart: always
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "${DATABASE_LOCATION}:/var/lib/postgresql/data"
